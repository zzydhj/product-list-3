<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- GEN:TITLE BEGIN 此区块由生成工具托管，请勿手改 -->
    <title>Selection and Order Form</title>
    <!-- GEN:TITLE END -->

    <!-- 站点图标：使用根目录 /favicon.svg（SVG 自适应缩放，card-holder 与 TPU 共用同一份） -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- 引入 Tailwind：已改为本地静态 CSS（方案 1），不再依赖运行时 CDN。
         样式表在 </head> 前引入，以保持与原 Play CDN 注入顺序一致的层叠关系，见文件末尾。 -->

    <!-- 引入 Font Awesome 6 图标库（已本地化至 vendor/fontawesome，版本 6.5.2，与原 cdnjs 一致）：
         移动端底栏 Menu / Download / Clear 与顶部通知栏小喇叭
         统一使用矢量图标，替代 Unicode 符号（☰ ⬇ ✕）——后者由各手机系统字体/表情字体
         渲染，粗细、大小、风格不一致，甚至会被渲染成彩色 emoji -->
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">

    <!-- 🛡️ 防护层 1：开启 Tailwind 霸道模式，强制覆盖 WP 样式。
         important: true 已在构建期写入 tailwind.config.js，生成的 tailwind.css
         中所有工具类均带 !important，效果与原运行时配置完全一致。 -->

    <style>
        /* 🛡️ 防护层 0：显式声明全局字体。
           页面原先从未声明 font-family，文字字体完全取决于各设备系统默认字体：
           国产安卓手机的系统字体是厂商中文字体（MiSans / HarmonyOS Sans 等），
           其英文字形设计与常规英文字体差异很大，导致底栏英文小标签在手机上
           看起来“字形很奇怪”。现统一为：主流英文系统字体优先、中文字体兜底。 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
                "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        /* 🛡️ 防护层 2：强制剥离 WordPress 对按钮和输入框的默认干扰 */
        button {
            background-color: transparent !important;
            border-radius: 0 !important;
            text-shadow: none !important;
            box-shadow: none !important;
        }

        input {
            background-color: transparent !important;
            box-shadow: none !important;
        }

        /* 🛡️ 防护层 3：加固您自己的自定义样式 */
        .product-card {
            transition: all 0.2s !important;
        }

        .product-card.active {
            border-color: #3b82f6 !important;
            background-color: #eff6ff !important;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5) !important;
        }

        /* 停用与预售产品（数量行里 form: 'disabled' / 'presale'）：
           图片保持原样（彩色、可点击放大），数量框由 disabled 属性禁用并显示灰底灰字 */
        .product-card.disabled input[type=number] {
            background-color: #f3f4f6 !important;
            color: #9ca3af !important;
            cursor: not-allowed;
        }

        /* 预售与停用可见化样式：开始 */
        /* 停用与预售整卡：只把输入框涂灰不够——客户扫一眼网格分不出哪一格不能填。
           放在 .product-card.active 之后，两张卡同时带上这两个类时由本规则说话。 */
        .product-card.disabled {
            background-color: #f8fafc !important;
            border-color: #cbd5e1 !important;
        }

        .product-card.disabled h3 {
            color: #94a3b8 !important;
        }

        /* 预售文字画在 placeholder 里做不到渐变（::placeholder 不支持 background-clip: text），
           所以在数量框上盖一层真文字，复用 .sidebar-title 那支主题渐变（深藏青 → 蓝 → 亮蓝）。
           .qty-wrap 只是给这层文字一个定位参照；不支持渐变裁剪的浏览器退回纯蓝，不会隐身。 */
        .qty-wrap {
            position: relative;
        }

        .presale-flag {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            pointer-events: none;
            color: #1d4ed8;
            white-space: nowrap;
        }

        @supports ((-webkit-background-clip: text) or (background-clip: text)) {
            .presale-flag {
                background: linear-gradient(90deg, #1e3a8a, #3b82f6 70%, #60a5fa);
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
                color: transparent;
            }
        }
        /* 预售与停用可见化样式：结束 */

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none !important;
            margin: 0 !important;
        }

        input[type=number] {
            -moz-appearance: textfield !important;
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none !important;
        }

        .scrollbar-hide {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }

        /* Loading 文字呼吸动画 */
        @keyframes pulse-text {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .animate-pulse-text {
            animation: pulse-text 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* 菜单滑动提示动画 */
        @keyframes swipe-x {

            0%,
            100% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(-5px);
            }
        }

        .animate-swipe {
            animation: swipe-x 1.5s infinite;
        }

        /* ===== 侧边栏 Mega Menu ===== */
        .sidebar {
            position: fixed;
            left: 0;
            top: var(--promo-h);
            bottom: 0;
            width: 288px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
            border-right: 1px solid #e2e8f0;
            overflow: hidden;
            z-index: 50;
        }

        .sidebar-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }

        .sidebar-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .sidebar-footer {
            border-top: 1px solid #e2e8f0;
            background: #ffffff;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-stats {
            display: flex;
            gap: 8px;
        }

        .stat-cell {
            flex: 1;
            background: #f1f5f9;
            border-radius: 8px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-num {
            font-size: 18px;
            font-weight: 800;
            color: #2563eb;
            line-height: 1.1;
        }

        .stat-label {
            font-size: 10px;
            color: #64748b;
            margin-top: 2px;
        }

        .sidebar-actions {
            display: flex;
            gap: 8px;
        }

        .sb-btn-clear,
        .sb-btn-download {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 0;
            border-radius: 999px !important;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            border: none;
        }

        .sb-btn-clear {
            background: #fef2f2 !important;
            color: #ef4444 !important;
            border: 1px solid #fca5a5 !important;
        }

        .sb-btn-clear:hover {
            background: #fee2e2 !important;
        }

        .sb-btn-download {
            background: #2563eb !important;
            color: #ffffff !important;
            box-shadow: 0 1px 3px rgba(37, 99, 235, 0.4);
        }

        .sb-btn-download:hover {
            background: #1d4ed8 !important;
        }

        /* 目录标题：蓝渐变底条+左侧黄色 accent，与产品画册的分类标题条同款，醒目且风格统一 */
        .sidebar-title {
            position: relative;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            padding: 14px 16px 14px 21px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #1e3a8a, #3b82f6 70%, #60a5fa);
        }

        .sidebar-title::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: #fbbf24;
        }

        .mega-group-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            min-height: 48px;
            font-size: 15px;
            font-weight: 700;
            color: #374151;
            cursor: pointer;
            transition: all 0.15s;
            border-left: 3px solid transparent;
            user-select: none;
        }

        .mega-group-item:hover {
            background: #f1f5f9;
        }

        .mega-group-item.active {
            background: #2563eb;
            color: #ffffff;
            border-left-color: #1e40af;
        }

        .mega-group-name {
            flex: 1;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            overflow: hidden;
            word-break: break-word;
        }

        .mega-group-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            flex: 0 0 52px;
        }

        .mega-count {
            min-width: 22px;
            height: 22px;
            padding: 0 6px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #e2e8f0;
            color: #64748b;
            transition: all 0.2s;
        }

        .mega-group-item.active .mega-count {
            background: rgba(255, 255, 255, 0.28);
            color: #ffffff;
        }

        .mega-count.has-items {
            background: #ef4444;
            color: white;
        }

        .mega-group-item.active .mega-count.has-items {
            background: #ef4444;
            color: white;
        }

        .mega-arrow {
            font-size: 12px;
            color: #94a3b8;
            transition: transform 0.2s;
        }

        .mega-group-item.active .mega-arrow {
            transform: rotate(90deg);
            color: #ffffff;
        }

        .mega-sub-list {
            display: grid;
            grid-template-rows: 0fr;
            background: #ffffff;
            transition: grid-template-rows 0.28s ease;
        }

        .mega-sub-list.open {
            grid-template-rows: 1fr;
        }

        .mega-sub-inner {
            overflow: hidden;
        }

        .mega-sub-inner>.mega-sub-item:first-child {
            border-top: 1px solid #f1f5f9;
        }

        .mega-sub-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px 10px 28px;
            font-size: 14px;
            font-weight: 500;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.15s;
        }

        .mega-sub-item:hover {
            background: #f9fafb;
            color: #374151;
        }

        .mega-sub-item.active {
            color: #1e40af;
            font-weight: 700;
            background: #dbeafe;
            box-shadow: inset 3px 0 0 #2563eb;
        }

        .mega-sub-item>span:first-child {
            flex: 1;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            overflow: hidden;
            word-break: break-word;
        }

        .sub-count {
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            margin-left: 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            color: #9ca3af;
            flex-shrink: 0;
        }

        .mega-sub-item.active .sub-count {
            background: #bfdbfe;
            color: #1d4ed8;
        }

        .mega-sub-item.active .sub-count.has-items {
            background: #ef4444;
            color: #ffffff;
        }

        .mega-sub-group-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px 8px 28px;
            font-size: 12px;
            font-weight: 700;
            color: #475569;
            cursor: pointer;
            transition: background 0.15s;
        }

        .mega-sub-group-item:hover {
            background: #f9fafb;
        }

        .mega-sub-group-name {
            flex: 1;
            line-height: 1.5;
        }

        .mega-sub-group-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            flex: 0 0 40px;
        }

        .sub-arrow {
            font-size: 11px;
            color: #94a3b8;
            transition: transform 0.2s;
        }

        .mega-sub-group-item.open .sub-arrow {
            transform: rotate(90deg);
            color: #3b82f6;
        }

        .mega-sub-item--l3 {
            margin: 1px 10px 1px 26px;
            border-radius: 999px;
            padding: 6px 12px;
        }

        .mega-sub-item--l3.active {
            background: #e0f2fe;
            color: #0369a1;
            box-shadow: none;
        }

        .l3-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #cbd5e1;
            margin-right: 8px;
            vertical-align: middle;
        }

        .mega-sub-item--l3.active .l3-dot {
            background: #0284c7;
        }

        .sub-count.has-items {
            background: #ef4444;
            color: white;
        }

        .mobile-bar {
            display: none;
        }

        .mb-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 0 6px;
            background: none;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: #1f2937;
            font-family: inherit;
        }

        .mb-item:active {
            background: rgba(15, 23, 42, .06);
        }

        /* 统计数字：红色数字（购物车角标惯例）+ 34px 固定圆形底，与动作图标完全同尺寸对齐 */
        .mb-num {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 34px;
            height: 34px;
            padding: 0 4px;
            border-radius: 999px;
            background: #e2e8f0;
            color: #dc2626;
            font-size: 16px;
            font-weight: 900;
            line-height: 1;
        }

        /* 动作图标：统一 34px 圆形徽章 */
        .mb-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #e2e8f0;
            color: #334155;
            font-size: 15px;
            line-height: 1;
        }

        .mb-label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .3px;
            color: #1f2937;
        }

        .mb-download .mb-icon {
            background: #2563eb;
            color: #ffffff;
        }

        .mb-clear .mb-icon {
            background: #ef4444;
            color: #ffffff;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 49;
        }

        .sidebar-overlay.open {
            display: block;
        }

        @media (max-width: 1023px) {
            .sidebar {
                top: var(--promo-h) !important;
                width: min(340px, 88vw);
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                z-index: 200;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            /* 移动端底部栏：白底黑字，浅色清爽风格 */
            .mobile-bar {
                display: flex;
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 250;
                background: #ffffff;
                border-top: 1px solid #e2e8f0;
                box-shadow: 0 -2px 10px rgba(15, 23, 42, .08);
                padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px));
                gap: 4px;
            }

            /* P0-1 抽屉滚动区底部避让：移动端底栏 z-index(250) 高于抽屉(200)，且
               .sidebar-footer 在手机上是 display:none（原本由它占掉 117px），
               不留避让的话最靠下的一级分组会被底栏吃掉、无论怎么滚都点不到 */
            .sidebar-scroll {
                padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
            }

            .sidebar-footer {
                display: none;
            }

            /* P0-2 预留高度跟随安全区：底栏实际高 88.8px，带 home indicator 的机型上
               还要再加 env(safe-area-inset-bottom)（≈ 34px 时共 122.8px），
               写死 70px 会让最后一行的数量输入框被底栏压住、点不到 */
            #main-wrapper {
                padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)) !important;
            }
        }

        /* ===== 顶部促销跑马灯通知栏 ===== */
        :root {
            --promo-h: 42px;
        }

        .promo-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--promo-h);
            display: flex;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(90deg, #0f172a, #1e293b 50%, #0f172a);
            color: #ffffff;
            z-index: 400;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
        }

        /* 左侧固定标签：黄底黑字，与侧边栏标题的黄色 accent 呼应 */
        .promo-label {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 6px;
            height: 100%;
            padding: 0 14px;
            background: #fbbf24;
            color: #0f172a;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
            z-index: 2;
            box-shadow: 3px 0 10px rgba(0, 0, 0, .35);
        }

        /* 右侧滚动轨道 */
        .promo-track {
            flex: 1;
            display: flex;
            width: max-content;
            animation-name: promo-marquee;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        .promo-track:hover {
            animation-play-state: paused;
        }

        .promo-track .promo-item {
            padding: 0 32px;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 600;
            line-height: var(--promo-h);
            color: #f8fafc;
        }

        /* 文案里可用 <b> 高亮关键词，显示为主题黄 */
        .promo-track .promo-item b {
            color: #fbbf24;
            font-weight: 800;
        }

        @keyframes promo-marquee {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }

        /* 顶部通知栏占位：把主体内容与侧边栏整体下移，避免遮挡 */
        #main-wrapper {
            padding-top: var(--promo-h) !important;
        }

        @media (max-width: 640px) {
            .promo-track .promo-item {
                font-size: 13px;
                padding: 0 22px;
            }

            .promo-label {
                padding: 0 10px;
                font-size: 12px;
            }
        }

        /* 桌面端产品网格：固定 8 列，单列最大 195.56px（与原版卡片尺寸一致）；
           屏幕空间不足时列宽自动收缩，避免横向溢出。
           注：Tailwind 配置了 important:true，此处必须加 !important 才能覆盖 md:grid-cols-5 */
        @media (min-width: 1024px) {
            #product-grid {
                grid-template-columns: repeat(8, minmax(0, 195.56px)) !important;
                justify-content: center;
            }
        }
    </style>

    <!-- Tailwind 静态样式（方案 1 产物）：置于自定义 <style> 之后、</head> 之前，
         与原 Play CDN 运行时将 <style> 追加到 head 末尾的顺序一致，确保层叠关系不变 -->
    <link rel="stylesheet" href="tailwind.css">
</head>
<!-- 🌟 核心修复：增加 overflow-y-scroll 强制显示垂直滚动条轨道，防止切换分类时页面左右跳动 -->

<body id="main-wrapper" class="bg-gray-50 pb-10 min-h-screen box-border transition-all duration-300 overflow-y-scroll">

    <!-- ===== 顶部促销跑马灯通知栏（内容与速度在下方脚本的 PROMO_CONFIG 中修改）===== -->

                    const rows = kids.map(k => leafRow(k, leafIndex++, true)).join('');
                    return `
                        <div class="mega-sub-group-item" onclick="toggleSubGroup(${gi}, ${ei})" id="subgroup-item-${gi}-${ei}">
                            <span class="mega-sub-group-name">${entry.name}</span>
                            <span class="mega-sub-group-right">
                                <span class="sub-count" id="subgroup-count-${gi}-${ei}">0</span>
                                <span class="mega-arrow sub-arrow">›</span>
                            </span>
                        </div>
                        <div class="mega-sub-list nested" id="subgroup-list-${gi}-${ei}">
                            <div class="mega-sub-inner">${rows}</div>
                        </div>`;
                }).join('');
                return `
                    <div class="mega-group-item ${isActive ? 'active' : ''}" onclick="switchGroup(${gi})" id="group-item-${gi}">
                        <span class="mega-group-name">${groupName}</span>
                        <span class="mega-group-right">
                            <span class="mega-count" id="group-count-${gi}">0</span>
                            <span class="mega-arrow">›</span>
                        </span>
                    </div>
                    <div class="mega-sub-list ${isActive ? 'open' : ''}" id="sub-list-${gi}">
                        <div class="mega-sub-inner">
                        ${subHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function switchGroup(idx) {
            const groupName = categoryGroups[idx];
            // 点击一级分组 = 展开该组并显示全部产品；再次点击已激活的分组 = 回到全部
            currentGroup = groupName;
            currentCategory = null;
            // 不重建 DOM，仅切换 class，保留手风琴开合过渡动画
            categoryGroups.forEach((g, i) => {
                const item = document.getElementById(`group-item-${i}`);
                const list = document.getElementById(`sub-list-${i}`);
                if (item) item.classList.toggle('active', i === idx);
                if (list) list.classList.toggle('open', i === idx);
            });
            document.querySelectorAll('.mega-sub-item.active').forEach(el => el.classList.remove('active'));
            calculateTotals();
            document.querySelectorAll('.product-card').forEach(card => {
                card.classList.toggle('hidden', card.dataset.group !== currentGroup);
            });
            loadImagesForGroup(currentGroup);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function switchCategory(idx) {
            const visibleCats = getVisibleCategories();
            currentCategory = visibleCats[idx];
            // 不重建 DOM，仅切换当前组内子分类高亮，保留过渡动画
            const gi = categoryGroups.indexOf(currentGroup);
            document.querySelectorAll(`#sub-list-${gi} .mega-sub-item`).forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });
            calculateTotals();
            document.querySelectorAll('.product-card').forEach(card => {
                if (card.dataset.group !== currentGroup) {
                    card.classList.add('hidden');
                } else if (currentCategory === null || card.dataset.category === currentCategory) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
            if (currentCategory) {
                loadImagesForCategory(currentCategory);
            } else {
                loadImagesForGroup(currentGroup);
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleSubGroup(gi, ei) {
            const list = document.getElementById(`subgroup-list-${gi}-${ei}`);
            const item = document.getElementById(`subgroup-item-${gi}-${ei}`);
            if (list) list.classList.toggle('open');
            if (item) item.classList.toggle('open');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('open');
        }

        function closeSidebar() {
            if (window.innerWidth < 1024) {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebar-overlay').classList.remove('open');
            }
        }

        function loadImage(img) {
            if (!img.dataset.src) return;
            img.onload = function () {
                this.classList.remove('opacity-0');
                this.classList.add('opacity-100');
                const spinner = this.parentElement.querySelector('.loading-spinner');
                if (spinner) spinner.style.display = 'none';
            };
            img.src = img.dataset.src;
            if (img.complete) img.onload();
            img.classList.remove('lazy-img');
            img.removeAttribute('data-src');
        }

        function loadImagesForCategory(cat) {
            document.querySelectorAll(`.product-card[data-category="${cat}"] .lazy-img`).forEach(img => {
                loadImage(img);
            });
        }

        function loadImagesForGroup(groupName) {
            document.querySelectorAll(`.product-card[data-group="${groupName}"] .lazy-img`).forEach(img => {
                loadImage(img);
            });
        }

        /* P2 兜底预加载：原先 5 秒一到就把剩余图片全量提升为 src，现在改为浏览器空闲时分片
           提升，每批 8 张；终态仍是“全部加载完”，可见效果与现在一致，只是不再集中在一个时间点。 */
        function idlePreload() {
            const run = (batch) => {
                const pending = document.querySelectorAll('.lazy-img');
                if (!pending.length) return;
                for (let i = 0; i < Math.min(batch, pending.length); i++) loadImage(pending[i]);
                schedule();
            };
            const schedule = () => {
                if (typeof window.requestIdleCallback === 'function') {
                    // timeout 4000：就算页面一直忙，最迟 4 秒也会跑一批，不会比现在慢
                    requestIdleCallback((d) => run(d.timeRemaining() > 0 ? Math.min(8, Math.max(1, Math.floor(d.timeRemaining() / 6))) : 2), { timeout: 4000 });
                } else {
                    setTimeout(() => run(8), 600);
                }
            };
            schedule();
        }
        idlePreload();

        // ================= 图片放大弹窗逻辑 =================
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(imageSrc) {
            lightboxImg.src = imageSrc;
            lightbox.classList.remove('hidden');
            void lightbox.offsetWidth;
            lightbox.classList.remove('opacity-0');
            lightboxImg.classList.remove('scale-95');
            lightboxImg.classList.add('scale-100');
        }

        function closeLightbox() {
            lightbox.classList.add('opacity-0');
            lightboxImg.classList.remove('scale-100');
            lightboxImg.classList.add('scale-95');
            setTimeout(() => {
                lightbox.classList.add('hidden');
                lightboxImg.src = '';
            }, 300);
        }

        // ================= 核心渲染与业务逻辑 =================
        const grid = document.getElementById('product-grid');
        const totalItemsEl = document.getElementById('total-items');
        const totalQtyEl = document.getElementById('total-qty');

        function renderProducts() {
            grid.innerHTML = products.map(product => `
                <div class="product-card bg-white border border-gray-200 rounded-lg overflow-hidden flex flex-col ${(product.category === currentCategory || currentCategory === null) && getGroupForCategory(product.category) === currentGroup ? '' : 'hidden'} ${isNoQty(product.id) ? 'disabled' : ''}" 
                     id="card-${product.id}" 
                     data-category="${product.category}"
                     data-group="${getGroupForCategory(product.category)}">
                     
                    <div class="aspect-square w-full bg-gray-100 relative cursor-pointer group overflow-hidden" onclick="openLightbox('${product.image}')">
                        <div class="absolute inset-0 flex items-center justify-center text-gray-400 text-[10px] sm:text-xs font-bold tracking-widest animate-pulse-text loading-spinner">
                            LOADING...
                        </div>
                        <img src="${PLACEHOLDER_IMG}" 
                             data-src="${product.image}" 
                             alt="${product.name}" 
                             class="lazy-img absolute inset-0 w-full h-full object-cover transition-all duration-500 group-hover:scale-110 opacity-0 z-10">
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors duration-300 flex items-center justify-center z-20">
                            <svg class="w-8 h-8 text-white opacity-0 group-hover:opacity-100 transition-opacity duration-300 drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
                        </div>
                        <span class="absolute top-1 left-1 bg-black/60 text-white text-[10px] px-1 rounded z-30 pointer-events-none">${product.id}</span>
                    </div>

                    <div class="p-2 flex flex-col flex-1">
                        <!-- 长标题两行显示：外层固定两行高度(40px)，并用负外边距上下各借 10px，
                             使两行标题以原单行位置为中心对称展开（第一行略上、第二行略下），
                             卡片总高、图片与输入框位置均保持不变；单行标题垂直居中留在原位。
                             行高收紧为 leading-4(16px)：两行更紧凑，且居中后第二行抬离输入框 -->
                        <div class="h-10 flex items-center justify-center overflow-hidden -mt-2.5 -mb-0.5">
                            <h3 class="text-sm leading-4 text-gray-700 font-bold line-clamp-2 break-all text-center m-0 p-0 w-full">${product.name}</h3>
                        </div>
                        <div class="qty-wrap">
                        <input 
                            type="number" 
                            min="0" 
                            step="1" 
                            placeholder="${phOf(product)}" 
                            class="w-full border border-gray-300 rounded px-2 py-1 text-center font-bold text-gray-800 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 bg-white"
                            style="border: 1px solid #d1d5db !important;"
                            oninput="handleInput('${product.id}', this)"
                            onblur="handleBlur('${product.id}', this)"
                            id="input-${product.id}"
                            ${isNoQty(product.id) ? 'disabled' : ''}
                        >
                        ${isPreSale(product.id) ? '<span class="presale-flag">Pre Sale</span>' : ''}
                        </div><!-- qty-wrap -->
                    </div>
                </div>
            `).join('');

            loadFromStorage();
            if (currentCategory) {
                loadImagesForCategory(currentCategory);
            } else {
                loadImagesForGroup(currentGroup);
            }
        }

        function updateVisuals(id, input) {
            if (isNoQty(id)) return; // 停用与预售不参与选中态：脚本塞值也不该亮起蓝框
            const card = document.getElementById(`card-${id}`);
            const val = parseInt(input.value) || 0;

            if (val > 0) {
                card.classList.add('active');
                card.classList.remove('border-gray-200');
            } else {
                card.classList.remove('active');
                card.classList.add('border-gray-200');
            }
        }

        function handleInput(id, input) {
            if (isNoQty(id)) return; // 同上，且不把填不进去的数量写进暂存与统计
            updateVisuals(id, input);
            calculateTotals();
            saveToStorage();
        }

        function calculateTotals() {
            let items = 0;
            let qty = 0;
            const catBreakdown = {};
            const groupBreakdown = {};

            categories.forEach(c => catBreakdown[c] = 0);
            categoryGroups.forEach(g => groupBreakdown[g] = 0);

            products.forEach(p => {
                const val = getQty(p.id);
                if (val > 0) {
                    items++;
                    qty += val;
                    catBreakdown[p.category] = (catBreakdown[p.category] || 0) + val;
                    const gn = p.category0;
                    if (gn) groupBreakdown[gn] = (groupBreakdown[gn] || 0) + val;
                }
            });

            totalItemsEl.innerText = items;
            totalQtyEl.innerText = qty;
            const mItemsEl = document.getElementById('m-total-items');
            const mQtyEl = document.getElementById('m-total-qty');
            if (mItemsEl) mItemsEl.innerText = items;
            if (mQtyEl) mQtyEl.innerText = qty;

            // 更新一级分组角标
            categoryGroups.forEach((g, i) => {
                const badge = document.getElementById(`group-count-${i}`);
                if (badge) {
                    const count = groupBreakdown[g] || 0;
                    badge.innerText = count;
                    badge.classList.toggle('has-items', count > 0);
                }
            });

            // 更新当前分组的二级分类角标
            const gi = categoryGroups.indexOf(currentGroup);
            if (gi >= 0) {
                const subCats = getVisibleCategories();
                subCats.forEach((cat, ci) => {
                    const badge = document.getElementById(`sub-count-${gi}-${ci}`);
                    if (badge) {
                        const count = catBreakdown[cat] || 0;
                        badge.innerText = count;
                        badge.classList.toggle('has-items', count > 0);
                    }
                });
                // 更新二级子组（三级父级）角标 = 其下三级叶子之和
                (categoryGroupMap[currentGroup] || []).forEach((entry, ei) => {
                    if (typeof entry === 'object') {
                        const sum = (entry.children || []).reduce((s, c) => s + (catBreakdown[c] || 0), 0);
                        const sb = document.getElementById(`subgroup-count-${gi}-${ei}`);
                        if (sb) {
                            sb.innerText = sum;
                            sb.classList.toggle('has-items', sum > 0);
                        }
                    }
                });
            }
        }

        function saveToStorage() {
            const data = {};
            products.forEach(p => {
                const val = getQty(p.id);
                if (val > 0) {
                    data[p.id] = val;
                }
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function loadFromStorage() {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                const data = JSON.parse(savedData);
                Object.keys(data).forEach(id => {
                    if (isNoQty(id)) return; // 停用与预售型号不恢复历史数量
                    const input = document.getElementById(`input-${id}`);
                    if (input) {
                        input.value = data[id];
                        fmtInput(input);            // 缓存里的小数、负数当场抹平
                        enforceMin(id, input, false); // 缓存里不足起订量的数量静默清掉（不弹窗打扰）
                        updateVisuals(id, input);
                    }
                });
                saveToStorage(); // 清洗过的数量回写，免得每次加载都重复处理一遍
            }
            calculateTotals();
        }

        function getBeijingTimeStr() {
            const d = new Date();
            const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
            const bjTime = new Date(utc + (3600000 * 8));

            const yyyy = bjTime.getFullYear();
            const mm = String(bjTime.getMonth() + 1).padStart(2, '0');
            const dd = String(bjTime.getDate()).padStart(2, '0');
            const hh = String(bjTime.getHours()).padStart(2, '0');
            const min = String(bjTime.getMinutes()).padStart(2, '0');
            const ss = String(bjTime.getSeconds()).padStart(2, '0');

            return `${yyyy}${mm}${dd}_${hh}${min}${ss}`;
        }

        function showDownloadModal() {
            const hasData = products.some(p => getQty(p.id) > 0);
            if (!hasData) {
                showNotice('Nothing selected', 'Please enter a quantity for at least one product. (请至少为一个产品填写数量)');
                return;
            }
            const modal = document.getElementById('download-modal');
            const content = document.getElementById('download-modal-content');
            const input = document.getElementById('customer-name');

            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');

            setTimeout(() => input.focus(), 300);
        }

        function closeDownloadModal() {
            const modal = document.getElementById('download-modal');
            const content = document.getElementById('download-modal-content');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        // ================= 提示弹窗：替代浏览器原生 alert =================
        // 三个提示（起订量、没选型号、没填名字）共用这一个组件，别再各写一份。
        // back 传进来的是触发提示的那个输入框，关掉后把光标还回去，客户好接着改。
        let noticeBack = null;
        function showNotice(title, text, back) {
            const modal = document.getElementById('notice-modal');
            const content = document.getElementById('notice-modal-content');
            document.getElementById('notice-title').textContent = title;
            document.getElementById('notice-text').textContent = text;
            noticeBack = back || null;
            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
            setTimeout(() => { const btn = modal.querySelector('button'); if (btn) btn.focus(); }, 300);
        }
        function closeNotice() {
            const modal = document.getElementById('notice-modal');
            const content = document.getElementById('notice-modal-content');
            if (modal.classList.contains('hidden')) return;
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
            const back = noticeBack;
            noticeBack = null;
            if (back && document.activeElement !== back) { try { back.focus(); } catch (e) { } }
        }
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeNotice(); });
        // ================= 提示弹窗结束 =================

        // ================= 恢复：纯文本 CSV 导出逻辑 =================
        function confirmDownload() {
            let nameInput = document.getElementById('customer-name').value.trim();
            if (!nameInput) {
                showNotice('Name required', 'Please enter your name before exporting. (导出前请先填写名字)');
                return;
            }

            let cleanName = nameInput.replace(/[^a-zA-Z0-9]/g, '').substring(0, 7);
            if (!cleanName) cleanName = "Customer";

            closeDownloadModal();
            exportToExcel(cleanName);
        }

        function exportToExcel(customerName) {
            const selectedProducts = products.filter(p => getQty(p.id) > 0);

            const grouped = {};
            selectedProducts.forEach(p => {
                if (!grouped[p.category]) grouped[p.category] = [];
                grouped[p.category].push({ ...p, val: getQty(p.id) });
            });

            const activeCategories = Object.keys(grouped);
            let maxRows = 0;
            activeCategories.forEach(cat => {
                if (grouped[cat].length > maxRows) maxRows = grouped[cat].length;
            });

            let csvContent = "\uFEFF";
            let headerRow = [];
            activeCategories.forEach(cat => {
                headerRow.push("型号ID", "产品名称", "所属系列", "订购数量", "");
            });
            csvContent += headerRow.join(",") + "\n";

            for (let i = 0; i < maxRows; i++) {
                let row = [];
                activeCategories.forEach(cat => {
                    const item = grouped[cat][i];
                    if (item) {
                        row.push(item.id, item.name.replace(/,/g, " "), item.category, item.val, "");
                    } else {
                        row.push("", "", "", "", "");
                    }
                });
                csvContent += row.join(",") + "\n";
            }

            // ===== 新增：汇总求和行 =====
            let sumRow = [];
            activeCategories.forEach(cat => {
                const total = grouped[cat].reduce((acc, item) => acc + item.val, 0);
                sumRow.push("合计", "", "", total, "");
            });
            csvContent += sumRow.join(",") + "\n";
            // ===== 汇总行结束 =====

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);

            const timeStr = getBeijingTimeStr();
            const fileName = `${customerName}_${timeStr}.csv`;

            link.setAttribute("href", url);
            link.setAttribute("download", fileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function resetAll() {
            if (confirm('Are you sure to clear all selected quantities? This action cannot be undone. (确定要清空所有已选数量吗？此操作无法撤销。)')) {
                products.forEach(p => {
                    const input = document.getElementById(`input-${p.id}`);
                    if (input) {
                        input.value = '';
                        updateVisuals(p.id, input);
                    }
                });
                localStorage.removeItem(STORAGE_KEY);
                calculateTotals();
            }
        }

        window.onbeforeunload = function (e) {
            if (parseInt(totalQtyEl.innerText) > 0) {
                e = e || window.event;
                if (e) { e.returnValue = 'You have unsaved orders, are you sure you want to leave?'; }
                return 'You have unsaved orders, are you sure you want to leave?';
            }
        };

        renderSidebar();
        renderProducts();
        initPromo();
    </script>
</body>
