<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Product List">
    <!-- 背景：蓝色渐变圆角方形，与站点主色 #2563eb / #3b82f6 一致 -->
    <defs>
        <linearGradient id="pl-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b82f6"/>
            <stop offset="1" stop-color="#1d4ed8"/>
        </linearGradient>
    </defs>
    <rect width="32" height="32" rx="7" fill="url(#pl-bg)"/>

    <!-- 主体：一张白色评级板（Grading Slab）轮廓 -->
    <rect x="10" y="6" width="12" height="20" rx="1.5" fill="#ffffff"/>

    <!-- 顶部金色标签条，模拟评级机构标签区 -->
    <path d="M10 7.5 a1.5 1.5 0 0 1 1.5 -1.5 h9 a1.5 1.5 0 0 1 1.5 1.5 v3 h-12 z" fill="#fbbf24"/>

    <!-- 内容线：代表卡片信息条目，尺寸经过挑选，在 16px 下仍清晰 -->
    <rect x="12" y="14" width="8" height="1.4" rx="0.7" fill="#cbd5e1"/>
    <rect x="12" y="18" width="8" height="1.4" rx="0.7" fill="#cbd5e1"/>
    <rect x="12" y="22" width="5" height="1.4" rx="0.7" fill="#94a3b8"/>
</svg>
