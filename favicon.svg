<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="评级板与卡盒选款表">
    <!-- 一张评级板（Grading Slab）：白色板体 + 金色标签区 + 窗里的深蓝卡片，
         底板用站点主题蓝渐变。几何与 tools/make-favicon.mjs 的 SHAPES 一一对应，
         改一处要同步另一处（PNG 版由那个脚本生成）。
         尺寸全部落在 32 网格的 0.5 倍数上：16px 下 1 个网格单位只有 0.5 物理像素，
         比这更细的线条会糊成灰雾，所以这里没有任何发丝线。 -->
    <defs>
        <linearGradient id="slab-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b82f6"/>
            <stop offset="1" stop-color="#1d4ed8"/>
        </linearGradient>
    </defs>
    <rect width="32" height="32" rx="7" fill="url(#slab-bg)"/>

    <!-- 板体：上面两角圆、下面直角 -->
    <path d="M8.5 7.5 a2.5 2.5 0 0 1 2.5 -2.5 h10 a2.5 2.5 0 0 1 2.5 2.5 V27 H8.5 Z" fill="#ffffff"/>

    <!-- 顶部标签区（评级机构贴标签的位置） -->
    <path d="M8.5 7.5 a2.5 2.5 0 0 1 2.5 -2.5 h10 a2.5 2.5 0 0 1 2.5 2.5 V11 H8.5 Z" fill="#fbbf24"/>

    <!-- 观察窗与窗里的卡片 -->
    <rect x="11" y="13.5" width="9" height="10.5" rx="1.5" fill="#dbeafe"/>
    <rect x="12.5" y="15" width="6" height="7.5" rx="1" fill="#1d4ed8"/>
</svg>
